spring.application.name=backend

spring.datasource.url=jdbc:h2:file:./data/home-maintenance-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
app.jwt.secret=${APP_JWT_SECRET:homecare-tracker-local-development-jwt-secret-key-must-be-at-least-32-characters-long}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}