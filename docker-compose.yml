services:
  postgres:
    image: postgres:16
    container_name: home-maintenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_maintenance_db}
      POSTGRES_USER: ${POSTGRES_USER:-home_maintenance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_maintenance_password}
    ports:
      - "5432:5432"
    volumes:
      - home_maintenance_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-maintenance-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-home_maintenance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_maintenance_password}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-maintenance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  home_maintenance_postgres_data:
